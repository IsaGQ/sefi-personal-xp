<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEFI-Personal | Ambiente de pruebas</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { color: #1f3864; }
    .estado { background: #ecfdf5; border: 1px solid #10b981; border-radius: 8px; padding: 1rem; }
    code { background: #f3f4f6; padding: 0 .3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>SEFI-Personal</h1>
  <p>¿En cuánto me quedo sin plata? Ambiente de pruebas.</p>
  <div class="estado">
    <strong>Despliegue continuo activo</strong><br>
    Commit desplegado: <code id="commit">__COMMIT__</code><br>
    Fecha del despliegue: <span id="fecha">__FECHA__</span>
  </div>
</body>
</html>
