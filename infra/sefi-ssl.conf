<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/ssl/sefi/sefi.crt
    SSLCertificateKeyFile /etc/ssl/sefi/sefi.key

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog  ${APACHE_LOG_DIR}/sefi-error.log
    CustomLog ${APACHE_LOG_DIR}/sefi-access.log combined
</VirtualHost>
